# Render Blueprint. `name` MUST match the existing Render web service
# (youtube-autopilot-agent-1): a Blueprint sync adopts the live service when the
# name matches and creates a *second* service when it does not.
services:
  - type: web
    name: youtube-autopilot-agent-1
    runtime: node
    plan: free
    # Production tracks main only. Preview environments are created per PR by
    # Render's repo binding and are not a production deploy.
    branch: main
    # Lockfile-exact install: no version drift between CI and production.
    # jsdom is only used by the UI tests, so it is excluded from the runtime
    # install: on a 512 MB free instance it is pure memory and disk pressure,
    # and `npm run build` only needs build.js. Use `npm ci` (not --omit=dev) in
    # CI so the tests keep the full tree.
    # ffmpeg-static downloads its binary during install; if that download is
    # unavailable the code falls back to the ffmpeg on PATH (Render's native
    # runtime ships 4.1, which the renderer now supports).
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Required: real story, images and Hindi voice are blocked without it.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_SCRIPT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: GEMINI_TTS_MODEL
        value: gemini-2.5-flash-preview-tts
      # Optional: only used when GEMINI_SCRIPT_MODEL answers 404/429. Deliberately
      # left without a value - its availability is not verified, so nothing is
      # claimed here. Unset means the code default applies.
      - key: GEMINI_SCRIPT_FALLBACK_MODEL
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        sync: false
      - key: APP_SESSION_SECRET
        sync: false
      # YouTube category for uploads. 22 = People & Blogs, which is where a Hindi
      # kids' cartoon channel belongs. The code defaults to "22" when unset, so
      # this only needs changing if the channel moves category.
      - key: DEFAULT_YOUTUBE_CATEGORY_ID
        value: 22
      # Required to create an account after the first one. sync:false keeps the
      # value in Render's dashboard only - it is never written into the repo.
      - key: APP_REGISTRATION_KEY
        sync: false
      # ---- Backup storage -------------------------------------------------
      # Without one of these two blocks every redeploy deletes every project and
      # rendered MP4, and there is nothing to restore from. The app says
      # STORAGE_NOT_CONFIGURED rather than pretending to have a backup.
      #
      # Option A - an S3-compatible bucket (Cloudflare R2, Backblaze B2, MinIO).
      # All four values are required together; the driver stays off until then.
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_SECRET_KEY
        sync: false
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_PREFIX
        sync: false
      # Option B - a directory on an attached Render Disk (paid). Point DATA_DIR
      # at the same disk so projects live there too, not just the backups.
      - key: STORAGE_LOCAL_DIR
        sync: false
      - key: STORAGE_TIMEOUT_MS
        value: 30000
      # Optional knobs, unset by default:
      #   FFMPEG_PRESET=ultrafast  -> faster encodes on a 512 MB free instance
      #   FFMPEG_PATH=/path/ffmpeg -> use a specific binary instead of the bundled one
      #   DATA_DIR=/var/data       -> only when a Render Disk is attached; the
      #                               free filesystem is ephemeral, so projects
      #                               and renders are lost on every redeploy.
      #   APP_SESSION_SECRET       -> already listed above; rotating it signs
      #                               every user out, which is the point.
      #   RHUBARB_PATH             -> optional native Rhubarb binary for lip-sync;
      #                               the bundled WASM package needs nothing.
