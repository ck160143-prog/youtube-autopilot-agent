name: Node checks
concurrency:
  group: node-checks-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/baba-ai-durable-automation]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify text thumbnail rendering with FFmpeg
        run: node --test tests/ffmpeg-thumbnail.integration.test.js
        env:
          RUN_FFMPEG_THUMBNAIL_INTEGRATION: "1"
      - name: Verify captioned MP4 rendering with FFmpeg
        run: node --test tests/ffmpeg-captions.integration.test.js
        env:
          RUN_FFMPEG_INTEGRATION: "1"
          FFMPEG_RENDER_TIMEOUT_MS: "45000"
      - name: Live Supabase private storage integration (only when configured)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
        run: |
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SERVICE_ROLE_KEY:-}" || -z "${SUPABASE_STORAGE_BUCKET:-}" ]]; then
            echo "::notice::Supabase integration skipped because protected test credentials/bucket are not configured."
            exit 0
          fi
          node --test tests/supabase-storage.integration.test.js

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baba_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baba_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Run real PostgreSQL integration test
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/baba_ai_test
