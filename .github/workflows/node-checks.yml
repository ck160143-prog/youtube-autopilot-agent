name: Node checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/baba-ai-durable-automation]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test
