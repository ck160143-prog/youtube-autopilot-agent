name: Sync npm lockfile
on:
  push:
    branches: [feature/baba-ai-durable-automation]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/sync-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, 'chore: sync npm lockfile')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/baba-ai-durable-automation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile"
            git push origin HEAD:feature/baba-ai-durable-automation
          else
            echo "package-lock.json already synchronized"
          fi
