name: BABA AI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/audit-api-errors-render-config"]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run API regression tests
        run: npm test
      - name: Build frontend and project ZIP
        run: npm run build
