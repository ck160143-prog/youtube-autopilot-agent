name: BABA AI CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # The renderer, rig, lip-sync and end-to-end tests assert on a real MP4.
      # Without a binary they skip, which would make CI silently test nothing.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lockfile-exact install: the same tree CI tests is the tree Render builds.
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Build frontend and project ZIP
        run: npm run build
